name: Deploy to GCP

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy intelligent-network-backend \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --platform managed

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Build React App
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Deploy to Cloud Storage
        run: |
          gsutil -m rsync -r -d ./frontend/build gs://intelligent-network-website
